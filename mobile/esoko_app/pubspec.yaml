name: esoko_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State management — matches the plan's choice (see the mobile plan
  # this app was scaffolded from): explicit providers over an ambient
  # global, testable without a widget tree.
  flutter_riverpod: ^2.6.1
  # Declarative routing with auth-aware redirects (signed-out users
  # bounced to /sign-in from any deep link).
  go_router: ^14.6.2
  # HTTP client for core-go's /v1/* REST surface.
  dio: ^5.7.0
  # Bearer token at rest — Keychain on iOS, Keystore on Android. Never
  # SharedPreferences for this; see lib/core/auth/token_store.dart.
  flutter_secure_storage: ^9.2.2
  # Renders a Ticket's `code` as a scannable QR for "My tickets".
  qr_flutter: ^4.1.0
  # Camera QR scan for bus boarding codes + tout receipt verify.
  # Thin UI only: every scan resolves through core-go (HMAC + status).
  # v7 uses Apple Vision on iOS (no MLKit pods) — required for
  # simulator builds (MLImage has no simulator slice).
  mobile_scanner: ^7.4.0
  # Device location for "stores near me" (GET /v1/stores/nearby) — the
  # click-and-collect search's GPS mode.
  geolocator: ^13.0.2
  # Opens the device's maps app for "Get directions" on a pickup order.
  url_launcher: ^6.3.1
  # WiFi gateway address for physical-device dev builds — lets an iPhone
  # that joined the Mac's hotspot reach the machine running core-go via
  # the hotspot's default gateway (see lib/core/api/api_config.dart).
  network_info_plus: ^6.1.0
  quick_actions: ^1.1.0
  # Renders the branded 24px stroke-icon set (ported from
  # packages/ui/src/Icon.tsx, see assets/icons/ + EsokoIcon) — no emoji,
  # no generic Cupertino/Material glyphs, matching web's icon language.
  flutter_svg: ^2.0.17
  # Renders the Code128 1D barcode on a parcel label — qr_flutter
  # above covers the QR half of the same label.
  barcode_widget: ^2.0.4
  # Builds the printable parcel-label PDF and hands it to the OS print
  # sheet (AirPrint et al) — see ParcelLabelScreen.
  printing: ^5.13.4
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Code generators only — regenerate native app icon / launch-screen
  # assets from assets/branding/*.png (see the flutter_icons:/
  # flutter_native_splash: config below) via:
  #   dart run flutter_launcher_icons
  #   dart run flutter_native_splash:create
  # Not a runtime dependency of the app itself.
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  assets:
    - assets/branding/
    - assets/icons/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

  # The Outfit display typeface — the same one tokens.css uses for
  # --font-display on web — bundled so mobile matches the web's brand
  # voice (see EsokoTypography). This is a single variable-weight TTF
  # (Thin–Black); the duplicate entries below let Flutter resolve each
  # FontWeight against the same file instead of metric-synthesizing it.
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
          weight: 400
        - asset: assets/fonts/Outfit.ttf
          weight: 500
        - asset: assets/fonts/Outfit.ttf
          weight: 600
        - asset: assets/fonts/Outfit.ttf
          weight: 700
        - asset: assets/fonts/Outfit.ttf
          weight: 800

    # Body typeface — tokens.css's --font-body. Web's other two voices
    # (mobile only had --font-display before this redesign pass): a
    # single variable-weight TTF, same duplicate-entry trick as Outfit.
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans.ttf
          weight: 700

    # Data/mono typeface — tokens.css's --font-mono, used for prices,
    # IDs, codes: anywhere digits need to line up and read unambiguously.
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600

# App icon — the green Esoko mark (assets/branding/esoko-app-icon.png).
# iOS/Android launcher icons are generated from a full-bleed, alpha-free
# copy (esoko-app-icon-flat.png) because Apple rejects alpha; the Android
# adaptive icon layers the original rounded design over the same green.
# Regenerate after editing the artwork with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/esoko-app-icon-flat.png"
  # Android adaptive icon: green background, mark-only foreground with
  # generous padding so it survives circular/squircle/square launcher
  # masks without clipping.
  adaptive_icon_background: "#02B026"
  adaptive_icon_foreground: "assets/branding/esoko-app-icon.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/branding/app_icon.png"
    background_color: "#0A2E4D"
    theme_color: "#0A2E4D"

# Native launch screen shown before the Flutter engine/first frame is
# ready — this is the actual "before app opens" loader, distinct from
# any in-app splash widget. The logo is the red-mark + green-wordmark
# lockup (esoko-full-logo-clean.png, chroma-keyed off its #212121 mock
# canvas) sitting on the navy brand color, matching the dark mock it
# was designed on. Regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0A2E4D"
  image: assets/branding/esoko-full-logo-clean.png
  android_12:
    color: "#0A2E4D"
    image: assets/branding/esoko-full-logo-clean.png
