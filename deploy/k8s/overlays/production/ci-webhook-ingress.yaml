# See deploy/k8s/overlays/preview/ci-webhook-ingress.yaml for the full
# rationale — identical shape, production's own hostname and TLS
# secret.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ci-webhook
  annotations:
    cert-manager.io/issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - secretName: ci-webhook-production-tls
      hosts:
        - ci-production.esoqo.com
  rules:
    - host: ci-production.esoqo.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: ci-webhook, port: { number: 80 } } } }
