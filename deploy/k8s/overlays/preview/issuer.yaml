# ════════════════════════════════════════════════════════════════════
#  Namespaced cert-manager Issuers, scoped to esoqo-preview.
#
#  See the production overlay's issuer.yaml for the full reasoning: a
#  ClusterIssuer needs cluster-admin, which this Rancher account has
#  never had, but a namespaced Issuer needs only the same
#  namespace-level rights as every other object in this overlay and
#  cert-manager treats it identically otherwise.
#
#  DNS-01, not HTTP-01. Preview hosts sit behind Cloudflare's proxy and
#  are gated by Cloudflare Access, which intercepts every path on the
#  host — including `/.well-known/acme-challenge/`. HTTP-01 therefore
#  cannot complete. DNS-01 sidesteps the proxy entirely: cert-manager
#  writes a `_acme-challenge` TXT record via the Cloudflare API and
#  never talks to the ingress.
#
#  The solver reads its token from the `cloudflare-api-token` Secret
#  (key `api-token`), created out-of-band by create-secrets.sh — never
#  committed. The token needs Zone:Read + DNS:Edit on esoko.global.
# ════════════════════════════════════════════════════════════════════
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: emmanuelodero808@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: emmanuelodero808@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
