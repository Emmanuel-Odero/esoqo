# ════════════════════════════════════════════════════════════════════
#  preview ingress — one-level hosts in the esoko.global zone
#
#  Every host is a single label (preview, preview-app, …), NOT nested
#  under `preview.`. The zone is on Cloudflare and the plan's Universal
#  SSL certificate covers exactly one level (`esoko.global` and
#  `*.esoko.global`), so `app.preview.esoko.global` could not be proxied.
#  One-level names let the orange-cloud proxy sit in front and enforce
#  Cloudflare Access.
#
#  Hosts are listed EXPLICITLY rather than as a wildcard: cert-manager
#  issues each via Cloudflare DNS-01 (see issuer.yaml), so no wildcard is
#  needed and the certs are what Cloudflare talks to over Full (strict).
#  Each host needs its own proxied A record in the esoko.global zone.
#
#  See docs/deployment/README.md § "TLS, proxying and Access".
# ════════════════════════════════════════════════════════════════════
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: esoqo
  annotations:
    cert-manager.io/issuer: letsencrypt-prod
    # Server Actions accept up to 1MB file uploads, plus base64/multipart
    # overhead; nginx's 1MB default would reject them at the proxy with
    # a 413 before the app ever sees the request.
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # preview is a preview environment and must never be indexed.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Robots-Tag: noindex, nofollow";
spec:
  ingressClassName: traefik
  tls:
    - secretName: esoqo-preview-tls
      hosts:
        - preview.esoko.global
        - preview-app.esoko.global
        - preview-admin.esoko.global
        - preview-store.esoko.global
        - preview-jamii.esoko.global
  rules:
    - host: preview.esoko.global
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
    - host: preview-app.esoko.global
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: app, port: { number: 80 } } } }
    - host: preview-admin.esoko.global
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: admin, port: { number: 80 } } } }
    - host: preview-store.esoko.global
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: store, port: { number: 80 } } } }
    - host: preview-jamii.esoko.global
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: jamii, port: { number: 80 } } } }
---
# The two backend APIs are exposed on their own hostnames because the
# mobile app and the M-Pesa/Pesapal callbacks both need a public URL.
# Path-routing them under the web host instead would collide with the
# Next apps' own /api routes.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: esoqo-api
  annotations:
    cert-manager.io/issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
spec:
  ingressClassName: traefik
  tls:
    - secretName: esoqo-preview-api-tls
      hosts:
        - preview-api.esoko.global
        - preview-mobile.esoko.global
  rules:
    - host: preview-api.esoko.global
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: core-service, port: { number: 80 } } } }
    - host: preview-mobile.esoko.global
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: core-go, port: { number: 80 } } } }
