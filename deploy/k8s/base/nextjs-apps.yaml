# ════════════════════════════════════════════════════════════════════
#  The five Next.js apps.
#
#  Kept in one file rather than five, because they differ only in name,
#  port and image — every other line (probes, envFrom, security context,
#  rollout strategy) must stay identical, and five files is five places
#  for them to drift apart. Per-environment differences (replicas,
#  resources, image tag) are Kustomize patches in the overlays, not
#  edits here.
#
#  Config arrives entirely through envFrom:
#    · esoqo-config  — ConfigMap, per-overlay, in git. Non-secret URLs
#                      and feature flags.
#    · esoqo-db      — Secret, created out-of-band. Connection strings.
#    · esoqo-secrets — Secret, created out-of-band. Signing keys, API
#                      credentials, payment provider secrets.
#
#  Note the images are per-environment despite coming from one commit:
#  NEXT_PUBLIC_* are compiled into the client bundle, so a testnet image
#  has testnet URLs baked in and can never be promoted to production.
#  See docs/deployment/README.md § "Why images are not promoted".
# ════════════════════════════════════════════════════════════════════

# ── web (marketing + public parcel tools) ───────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: web
  labels: { app.kubernetes.io/name: web, app.kubernetes.io/part-of: esoqo }
spec:
  ports: [{ name: http, port: 80, targetPort: 3000 }]
  selector: { app.kubernetes.io/name: web }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: { app.kubernetes.io/name: web, app.kubernetes.io/part-of: esoqo }
spec:
  replicas: 2
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: web, app.kubernetes.io/part-of: esoqo }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1001 }
      containers:
        - name: web
          image: ghcr.io/emmanuel-odero/esoqo-web:latest
          ports: [{ name: http, containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: esoqo-config }
            - secretRef: { name: esoqo-db }
            - secretRef: { name: esoqo-secrets }
          # /api/health touches the database. startupProbe absorbs the
          # slow first boot (Next's cold start plus the first Prisma
          # connection through PgBouncer) so livenessProbe can stay
          # tight afterwards without killing a healthy pod mid-boot.
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
            failureThreshold: 30 # 150s budget to come up
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 1Gi }
---
# ── app (authenticated member app) ──────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: app
  labels: { app.kubernetes.io/name: app, app.kubernetes.io/part-of: esoqo }
spec:
  ports: [{ name: http, port: 80, targetPort: 3001 }]
  selector: { app.kubernetes.io/name: app }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels: { app.kubernetes.io/name: app, app.kubernetes.io/part-of: esoqo }
spec:
  replicas: 2
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: app }
  template:
    metadata:
      labels: { app.kubernetes.io/name: app, app.kubernetes.io/part-of: esoqo }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1001 }
      containers:
        - name: app
          image: ghcr.io/emmanuel-odero/esoqo-app:latest
          ports: [{ name: http, containerPort: 3001 }]
          envFrom:
            - configMapRef: { name: esoqo-config }
            - secretRef: { name: esoqo-db }
            - secretRef: { name: esoqo-secrets }
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # Higher than its siblings: this app accepts 11MB Server
            # Action uploads (next.config.mjs bodySizeLimit), which are
            # buffered in memory.
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1536Mi }
---
