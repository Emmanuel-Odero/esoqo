# ════════════════════════════════════════════════════════════════════
#  ci-webhook RBAC — deliberately NOT part of the base kustomization.
#
#  The esoqo-deployer Job applies the whole rendered overlay on every
#  deploy, and its ServiceAccount is bound to the built-in `edit`
#  ClusterRole (see ci-webhook.yaml). `edit` cannot get/manage Roles or
#  RoleBindings, so including these objects in the render made every
#  apply fail with `Forbidden` on roles/rolebindings. They are static
#  bootstrap objects, applied once per namespace by an operator:
#
#    kubectl apply -f deploy/k8s/base/ci-webhook-rbac.yaml -n esoqo-preview
#    kubectl apply -f deploy/k8s/base/ci-webhook-rbac.yaml -n esoqo-production
#
#  Kept out of the deployer's blast radius on purpose.
# ════════════════════════════════════════════════════════════════════
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-webhook
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-webhook
subjects:
  - kind: ServiceAccount
    name: ci-webhook
roleRef:
  kind: Role
  name: ci-webhook
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: esoqo-deployer-edit
subjects:
  - kind: ServiceAccount
    name: esoqo-deployer
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
