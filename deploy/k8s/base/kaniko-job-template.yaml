# Template for one service's build, rendered by
# deploy/scripts/orchestrate.sh (plain `sed`, matching this repo's
# existing convention for the migrate Job's own name substitution —
# not a new templating system). One of these exists per service per
# deploy, named deterministically so a re-run for the same commit is
# idempotent rather than a pile-up of duplicate Jobs.
apiVersion: batch/v1
kind: Job
metadata:
  name: kaniko-__NAME__-__TAG__
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: esoqo-deployer
    app.kubernetes.io/component: ci
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: esoqo-deployer
        app.kubernetes.io/component: ci
    spec:
      restartPolicy: Never
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:latest
          args:
            - "--dockerfile=__DOCKERFILE__"
            - "--context=git://__GIT_REPO_HOST_PATH__#__GIT_SHA__"
            - "--destination=__REGISTRY__/__OWNER__/esoqo-__NAME__:__TAG__"
            - "--destination=__REGISTRY__/__OWNER__/esoqo-__NAME__:__ENVIRONMENT__"
            - "--cache=true"
            - "--cache-repo=__REGISTRY__/__OWNER__/esoqo-build-cache"
            - "--cache-ttl=168h"
            - "--verbosity=info"
__EXTRA_BUILD_ARGS__
          env:
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ci-git-credentials
                  key: GIT_READ_TOKEN
            - name: DOCKER_CONFIG
              value: /kaniko/.docker
          volumeMounts:
            - name: docker-config
              mountPath: /kaniko/.docker
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              memory: "8Gi"
      volumes:
        - name: docker-config
          secret:
            secretName: ci-ghcr-push
            items:
              - key: .dockerconfigjson
                path: config.json
