# ════════════════════════════════════════════════════════════════════
#  In-cluster CI — the test half of the pipeline that GitHub Actions
#  used to run (ci.yml). Actions is permanently broken server-side for
#  this repo (every push routes to an orphaned, deleted workflow_id and
#  fails at startup before any job is created), so `lint`, `typecheck`
#  and `test` have no home there any more. This Job is that home.
#
#  Rendered by deploy/scripts/orchestrate.sh (plain `sed`, same
#  convention as kaniko-job-template.yaml) and applied once per push,
#  ALONGSIDE the seven Kaniko builds — the deploy then waits for this
#  Job to succeed before it runs the migration or touches a single
#  Deployment, so a red suite stops the release the same way a red
#  build does.
#
#  Two native sidecars provide the Postgres and Redis that ci.yml's
#  `services:` block provided. They are initContainers with
#  `restartPolicy: Always` (Kubernetes ≥1.29 sidecars): the pod starts
#  them first, and the verify container only starts once both have
#  passed their startupProbe. Containers in one pod share a network
#  namespace, so the connection strings are the same `localhost:...`
#  ones ci.yml already used — no Service, no DNS names.
#
#  Self-contained on purpose: the whole workspace is cloned into an
#  emptyDir and dependencies installed fresh, so nothing here can depend
#  on state left behind by a previous run.
# ════════════════════════════════════════════════════════════════════
apiVersion: batch/v1
kind: Job
metadata:
  name: esoqo-verify-__TAG__
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: esoqo-verify
    app.kubernetes.io/component: ci
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800 # keep a week of history, same as the deployer/migrate Jobs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: esoqo-verify
        app.kubernetes.io/component: ci
    spec:
      restartPolicy: Never
      initContainers:
        # ── Ephemeral Postgres (replaces ci.yml's `postgres` service) ──
        - name: postgres
          image: postgres:16-alpine
          restartPolicy: Always # native sidecar: runs for the pod's lifetime
          env:
            - { name: POSTGRES_USER, value: esoqo }
            - { name: POSTGRES_PASSWORD, value: esoqo_ci }
            - { name: POSTGRES_DB, value: esoqo_test }
            # A fresh PGDATA subdir avoids the "directory exists but is
            # not empty" check on the mounted emptyDir.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          startupProbe:
            exec: { command: ["pg_isready", "-U", "esoqo"] }
            periodSeconds: 2
            failureThreshold: 30
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
        # ── Ephemeral Redis (replaces ci.yml's `redis` service) ────────
        - name: redis
          image: redis:7-alpine
          restartPolicy: Always
          startupProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 2
            failureThreshold: 30
      containers:
        - name: verify
          # The full (non-slim) Node image is buildpack-deps-based: it
          # already carries git and a C toolchain, so both the clone and
          # any native-module build a dependency needs just work — the
          # same assumptions ubuntu-latest made for ci.yml.
          image: node:22-bookworm
          workingDir: /repo
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              AUTH_URL="https://x-access-token:${GIT_READ_TOKEN}@${GIT_REPO_HOST_PATH}"
              git clone --filter=blob:none "$AUTH_URL" /repo
              cd /repo
              git checkout "$GIT_SHA"

              npm install -g pnpm@9.12.0   # matches packageManager in package.json
              pnpm install --frozen-lockfile
              pnpm db:generate
              pnpm --filter @esoqo/db migrate:deploy

              echo "== lint (includes DAL and a11y rules) =="
              pnpm lint
              echo "== typecheck =="
              # Cap concurrency: turbo's default 10 parallel tsc runs peak
              # past the old 4Gi cgroup limit and OOM-killed the gate
              # before it could report a result. 4 keeps the peak safely
              # inside the raised limit without stretching the run.
              pnpm typecheck --concurrency=4
              echo "== unit and integration tests =="
              pnpm test
              echo "== audit chain integrity =="
              pnpm --filter @esoqo/db audit:verify
              echo "== verify passed =="
          env:
            - { name: GIT_SHA, value: "__GIT_SHA__" }
            - { name: GIT_REPO_HOST_PATH, value: "__GIT_REPO_HOST_PATH__" }
            - name: GIT_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ci-git-credentials
                  key: GIT_READ_TOKEN
            # Same values as .github/workflows/ci.yml, so a green run here
            # means exactly what a green run there meant.
            - { name: DATABASE_URL,        value: "postgresql://esoqo:esoqo_ci@localhost:5432/esoqo_test" }
            - { name: DIRECT_DATABASE_URL, value: "postgresql://esoqo:esoqo_ci@localhost:5432/esoqo_test" }
            - { name: REDIS_URL,           value: "redis://localhost:6379" }
            - { name: SESSION_SECRET,      value: "ci_only_0000000000000000000000000000000000000000000000000000" }
            - { name: OTP_PEPPER,          value: "ci_only_1111111111111111111111111111111111111111111111111111" }
            - { name: AUDIT_CHAIN_SEED,    value: "ci_only_2222222222222222222222222222222222222222222222222222" }
            - { name: SMS_PROVIDER,        value: "console" }
          resources:
            requests: { cpu: 500m, memory: 2Gi }
            limits: { memory: 12Gi }
          volumeMounts:
            - { name: repo, mountPath: /repo }
      volumes:
        - name: repo
          emptyDir: {}
        - name: pgdata
          emptyDir: {}
