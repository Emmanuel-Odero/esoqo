name: esoko

services:
  # ─────────────────────────────────────────────────────────────
  # Postgres — source of truth. Nothing connects here directly
  # except migrations; the apps go through PgBouncer.
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: esoko-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: esoko
      POSTGRES_PASSWORD: esoko_dev_only
      POSTGRES_DB: esoko
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: postgres -c max_connections=100 -c shared_buffers=256MB -c work_mem=8MB -c log_min_duration_statement=500
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esoko -d esoko"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ─────────────────────────────────────────────────────────────
  # PgBouncer — the mandatory gatekeeper (ADR-0002).
  # Transaction mode. This is what stops connection fan-out
  # from flooding Postgres under elastic compute.
  # ─────────────────────────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: esoko-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: esoko
      DB_PASSWORD: esoko_dev_only
      DB_NAME: esoko
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "20"
      MIN_POOL_SIZE: "5"
      RESERVE_POOL_SIZE: "5"
      SERVER_RESET_QUERY: DISCARD ALL
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    ports:
      - "6432:5432"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5432 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  # ─────────────────────────────────────────────────────────────
  # Redis — sessions, OTP state, USSD session state, rate limits
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: esoko-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 384mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─────────────────────────────────────────────────────────────
  # MailHog — catches verification emails in development.
  # UI on http://localhost:8025
  # ─────────────────────────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: esoko-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    logging:
      driver: none

  # ─────────────────────────────────────────────────────────────
  # mock-sms — catches SMS in development, the way MailHog catches
  # email. HTTP GET /sendsms endpoint (Africa's Talking is a
  # different shape, see packages/auth/src/sms.ts's 'mock' branch),
  # plus a web UI to read what was "sent". UI + API on
  # http://localhost:8026. Opt-in: set SMS_PROVIDER=mock (see
  # .env.example) — development otherwise always forces console.
  # ─────────────────────────────────────────────────────────────
  mock-sms:
    image: mosipqa/mock-smtp:latest
    container_name: esoko-mock-sms
    restart: unless-stopped
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      WS_SERVER_PORT: "8081"
      # The browser reads these back from GET /config to know where to
      # open its websocket — must be the host-mapped port (8027) below,
      # not the container-internal one (8081), or the page never
      # connects and silently shows "No messages yet" forever.
      WS_EX_PROTOCOL: "ws"
      WS_EX_SERVER_PORT: "8027"
      WS_EX_BASE_PATH: ""
    ports:
      - "8026:8080"
      - "8027:8081"

  # ─────────────────────────────────────────────────────────────
  # Adminer — database inspection. http://localhost:8080
  # Dev only. Never exposed in any deployed environment.
  # ─────────────────────────────────────────────────────────────
  adminer:
    image: adminer:4.8.1-standalone
    container_name: esoko-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    ports:
      - "8080:8080"

  # ─────────────────────────────────────────────────────────────
  # Nginx — reverse proxy. http://localhost:80 → dev apps
  # ─────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: esoko-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      esoko-dev:
        condition: service_started

  # ─────────────────────────────────────────────────────────────
  # Dev — runs all Next.js apps + core service via turbo.
  # Hot-reload with poll-based file watching for Docker compat.
  # ─────────────────────────────────────────────────────────────
  esoko-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: esoko-dev
    restart: unless-stopped
    # .:/app below bind-mounts the whole repo for hot-reload, which would
    # also overlay every workspace's node_modules with whatever's on the
    # HOST (empty, or full of macOS binaries that can't run here). Each
    # workspace member gets its own named volume so its node_modules is
    # never touched by the bind mount and survives container restarts —
    # see docker/esoko-dev/entrypoint.sh for the install-once logic this
    # enables.
    #
    # Each Next.js app's .next also gets its own named volume, same
    # reasoning plus one more: Turbopack's persistent dev cache is an
    # embedded LSM-tree database (.sst/.meta files), and virtiofs/gRPC-FUSE
    # bind mounts (Docker Desktop, OrbStack) do not give it the write
    # semantics it assumes. Left on the bind mount it intermittently
    # corrupts ("Unable to open static sorted file ... No such file or
    # directory") and the dev server 500s on every request until the cache
    # is wiped. Off the bind mount, onto the container's own filesystem,
    # it doesn't corrupt.
    entrypoint: ["/app/docker/esoko-dev/entrypoint.sh"]
    ports:
      - "3000:3000"
      - "3001:3001"
      - "3002:3002"
      - "3003:3003"
      - "3004:3004"
      - "4000:4000"
    environment:
      CI: "true"
      APP_ENV: "${APP_ENV:-development}"
      DATABASE_URL: postgresql://esoko:esoko_dev_only@pgbouncer:5432/esoko?pgbouncer=true&connection_limit=10
      DIRECT_DATABASE_URL: postgresql://esoko:esoko_dev_only@postgres:5432/esoko
      REDIS_URL: redis://redis:6379
      CORE_API_URL: http://localhost:4000
      NODE_ENV: development
      SMS_MOCK_URL: http://mock-sms:8080
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      CHOKIDAR_USEPOLLING: "1"
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - node_modules_root:/app/node_modules
      - node_modules_web:/app/apps/web/node_modules
      - node_modules_app:/app/apps/app/node_modules
      - node_modules_admin:/app/apps/admin/node_modules
      - node_modules_store:/app/apps/store/node_modules
      - node_modules_jamii:/app/apps/jamii/node_modules
      - node_modules_db:/app/packages/db/node_modules
      - node_modules_ui:/app/packages/ui/node_modules
      - node_modules_domain:/app/packages/domain/node_modules
      - node_modules_auth:/app/packages/auth/node_modules
      - node_modules_a11y:/app/packages/a11y/node_modules
      - node_modules_config:/app/packages/config/node_modules
      - node_modules_payments:/app/packages/payments/node_modules
      - node_modules_core_service:/app/services/core/node_modules
      - next_cache_web:/app/apps/web/.next
      - next_cache_app:/app/apps/app/.next
      - next_cache_admin:/app/apps/admin/.next
      - next_cache_store:/app/apps/store/.next
      - next_cache_jamii:/app/apps/jamii/.next
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────
  # CECF WordPress stack — opt-in only (docker compose --profile cecf up)
  # Mirrors the two-service Render topology: cecf-mariadb (private,
  # self-hosted — Render has no managed MySQL) + cecf-wordpress
  # (nginx+php-fpm, built from the shared pnpm workspace).
  # ─────────────────────────────────────────────────────────────
  cecf-mariadb:
    image: mariadb:11
    container_name: cecf-mariadb
    profiles: ["cecf"]
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: cecf_dev_only
      MARIADB_DATABASE: cecf
      MARIADB_USER: cecf
      MARIADB_PASSWORD: cecf_dev_only
    ports:
      - "3306:3306"
    volumes:
      - cecfmysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12

  cecf-wordpress:
    build:
      context: .
      dockerfile: services/cecf-wordpress/Dockerfile
      args:
        APP_URL: http://childeldercare.test
    container_name: cecf-wordpress
    profiles: ["cecf"]
    restart: unless-stopped
    depends_on:
      cecf-mariadb:
        condition: service_healthy
    environment:
      PORT: "8080"
      WP_ENV: development
      WP_HOME: http://childeldercare.test
      WP_SITEURL: http://childeldercare.test/wp
      DB_HOST: cecf-mariadb
      DB_PORT: "3306"
      DB_NAME: cecf
      DB_USER: cecf
      DB_PASSWORD: cecf_dev_only
      MULTISITE_ENABLED: "true"
      MULTISITE_SUBDOMAIN: "true"
      MULTISITE_DOMAIN: childeldercare.test
      WP_ADMIN_USER: cecf-admin
      WP_ADMIN_PASSWORD: cecf_dev_only
      WP_ADMIN_EMAIL: dev@childeldercare.test
      REDIS_URL: redis://redis:6379/1
      # Where "Register"/"Apply" CTAs — and /apply/ itself — send people;
      # see App\Support\PageUrl::esokoJoinUrl(). localhost:3001 is the host
      # port apps/app's dev server binds to, reachable from this container
      # via the host's loopback (see also docker-compose's esoko-dev service).
      ESOKO_JOIN_URL: http://localhost:3001/join
      # Where every "page": "jamii" CTA sends people (pages/jamii.json,
      # the Programs/nav item introducing the product) — see
      # App\Support\PageUrl::esokoJamiiUrl(). Same host-loopback reasoning
      # as ESOKO_JOIN_URL above; 3004 is apps/jamii's own dev port.
      ESOKO_JAMII_URL: http://localhost:3004/
      # services/core's authenticated /api/cecf/* facade — see
      # App\Support\CecfApiClient. esoko-dev is the esoko stack's own
      # compose service name, reachable on the same docker network;
      # CECF_SERVICE_SECRET must match esoko-dev's own env exactly.
      ESOKO_CORE_API_URL: http://esoko-dev:4000
      CECF_SERVICE_SECRET: dev-cecf-secret-local-only
      AUTH_KEY: dev
      SECURE_AUTH_KEY: dev
      LOGGED_IN_KEY: dev
      NONCE_KEY: dev
      AUTH_SALT: dev
      SECURE_AUTH_SALT: dev
      LOGGED_IN_SALT: dev
      NONCE_SALT: dev
    ports:
      - "8090:8080"
    volumes:
      - cecfuploads:/var/www/html/web/app/uploads

volumes:
  pgdata:
  redisdata:
  cecfmysqldata:
  cecfuploads:
  node_modules_root:
  node_modules_web:
  node_modules_app:
  node_modules_admin:
  node_modules_store:
  node_modules_jamii:
  node_modules_db:
  node_modules_ui:
  node_modules_domain:
  node_modules_auth:
  node_modules_a11y:
  node_modules_config:
  node_modules_payments:
  node_modules_core_service:
  next_cache_web:
  next_cache_app:
  next_cache_admin:
  next_cache_store:
  next_cache_jamii:
