name: esoqo

services:
  # ─────────────────────────────────────────────────────────────
  # Postgres — source of truth. Nothing connects here directly
  # except migrations; the apps go through PgBouncer.
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: esoqo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: esoko
      POSTGRES_PASSWORD: esoko_dev_only
      POSTGRES_DB: esoko
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: postgres -c max_connections=100 -c shared_buffers=256MB -c work_mem=8MB -c log_min_duration_statement=500
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esoqo -d esoqo"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ─────────────────────────────────────────────────────────────
  # PgBouncer — the mandatory gatekeeper (ADR-0002).
  # Transaction mode. This is what stops connection fan-out
  # from flooding Postgres under elastic compute.
  # ─────────────────────────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: esoqo-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: esoko
      DB_PASSWORD: esoko_dev_only
      DB_NAME: esoko
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "20"
      MIN_POOL_SIZE: "5"
      RESERVE_POOL_SIZE: "5"
      SERVER_RESET_QUERY: DISCARD ALL
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    ports:
      - "6432:5432"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5432 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  # ─────────────────────────────────────────────────────────────
  # Redis — sessions, OTP state, USSD session state, rate limits
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: esoqo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 384mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─────────────────────────────────────────────────────────────
  # MailHog — catches verification emails in development.
  # UI on http://localhost:8025
  # ─────────────────────────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: esoqo-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    logging:
      driver: none

  # ─────────────────────────────────────────────────────────────
  # mock-sms — catches SMS in development, the way MailHog catches
  # email. HTTP GET /sendsms endpoint (Africa's Talking is a
  # different shape, see packages/auth/src/sms.ts's 'mock' branch),
  # plus a web UI to read what was "sent". UI + API on
  # http://localhost:8026. Opt-in: set SMS_PROVIDER=mock (see
  # .env.example) — development otherwise always forces console.
  # ─────────────────────────────────────────────────────────────
  mock-sms:
    image: mosipqa/mock-smtp:latest
    container_name: esoqo-mock-sms
    restart: unless-stopped
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      WS_SERVER_PORT: "8081"
      # The browser reads these back from GET /config to know where to
      # open its websocket — must be the host-mapped port (8027) below,
      # not the container-internal one (8081), or the page never
      # connects and silently shows "No messages yet" forever.
      WS_EX_PROTOCOL: "ws"
      WS_EX_SERVER_PORT: "8027"
      WS_EX_BASE_PATH: ""
    ports:
      - "8026:8080"
      - "8027:8081"

  # ─────────────────────────────────────────────────────────────
  # Adminer — database inspection. http://localhost:8080
  # Dev only. Never exposed in any deployed environment.
  # ─────────────────────────────────────────────────────────────
  adminer:
    image: adminer:4.8.1-standalone
    container_name: esoqo-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    ports:
      - "8080:8080"

  # ─────────────────────────────────────────────────────────────
  # Nginx — reverse proxy. http://localhost:80 → dev apps
  # ─────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: esoqo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      esoqo-dev:
        condition: service_started

  # ─────────────────────────────────────────────────────────────
  # Dev — runs all Next.js apps + core service via turbo.
  # Hot-reload with poll-based file watching for Docker compat.
  # ─────────────────────────────────────────────────────────────
  esoqo-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: esoqo-dev
    restart: unless-stopped
    # .:/app below bind-mounts the whole repo for hot-reload, which would
    # also overlay every workspace's node_modules with whatever's on the
    # HOST (empty, or full of macOS binaries that can't run here). Each
    # workspace member gets its own named volume so its node_modules is
    # never touched by the bind mount and survives container restarts —
    # see docker/esoqo-dev/entrypoint.sh for the install-once logic this
    # enables.
    #
    # Each Next.js app's .next also gets its own named volume, same
    # reasoning plus one more: Turbopack's persistent dev cache is an
    # embedded LSM-tree database (.sst/.meta files), and virtiofs/gRPC-FUSE
    # bind mounts (Docker Desktop, OrbStack) do not give it the write
    # semantics it assumes. Left on the bind mount it intermittently
    # corrupts ("Unable to open static sorted file ... No such file or
    # directory") and the dev server 500s on every request until the cache
    # is wiped. Off the bind mount, onto the container's own filesystem,
    # it doesn't corrupt.
    entrypoint: ["/app/docker/esoqo-dev/entrypoint.sh"]
    ports:
      - "3000:3000"
      - "3001:3001"
      - "3002:3002"
      - "3003:3003"
      - "3004:3004"
      - "4000:4000"
    environment:
      CI: "true"
      APP_ENV: "${APP_ENV:-development}"
      # Which pnpm dev task the entrypoint runs. "dev:apps" (the default)
      # is the lean set — web, app, admin, store, core-service — chosen
      # to fit the VM; DEV_TASK=dev runs every workspace including jamii.
      DEV_TASK: "${DEV_TASK:-dev:apps}"
      DATABASE_URL: postgresql://esoko:esoko_dev_only@pgbouncer:5432/esoko?pgbouncer=true&connection_limit=10
      DIRECT_DATABASE_URL: postgresql://esoko:esoko_dev_only@postgres:5432/esoko
      REDIS_URL: redis://redis:6379
      CORE_API_URL: http://localhost:4000
      CORE_GO_API_URL: http://core-go:4100
      # localhost/127.0.0.1 are jamii's own baked-in defaults (see
      # apps/jamii/src/middleware.ts) — jamii.esoko.test is the extra dev
      # hostname nginx fronts it on (docker/nginx/default.conf), added
      # rather than replacing the defaults so :3004 direct still works too.
      JAMII_PRIMARY_HOSTS: "jamii.esoko.test,ourjamii.co.ke,localhost,127.0.0.1"
      NODE_ENV: development
      # SMS_PROVIDER is passed through so .env can point the Node apps
      # at the local mock-sms catcher (SMS_PROVIDER=mock → localhost:8026)
      # the same way core-go's SMS_TEST_ENV does. Development otherwise
      # forces console (see packages/auth/src/sms.ts), so this only ever
      # opts IN to the catcher; it can't reach a real gateway from here.
      SMS_PROVIDER: "${SMS_PROVIDER:-console}"
      SMS_SENDER_ID: "${SMS_SENDER_ID:-ESOQO}"
      SMS_MOCK_URL: http://mock-sms:8080
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      CHOKIDAR_USEPOLLING: "1"
      WATCHPACK_POLLING: "true"
      # Not every workspace runs by default (see DEV_TASK below). On a
      # 16GB host the Docker VM is ~11GB, and four or five Turbopack dev
      # servers each leaking up to a multi-GB V8 heap is enough to OOM
      # the VM and take the whole stack down. Running a smaller set is
      # what actually keeps this stable; this cap is a secondary guard
      # so a single server can't ram the VM ceiling and get a neighbour
      # OOM-killed (the quiet way ports used to go dark with no log).
      NODE_OPTIONS: "--max-old-space-size=2048"
    volumes:
      - .:/app
      - node_modules_root:/app/node_modules
      - node_modules_web:/app/apps/web/node_modules
      - node_modules_app:/app/apps/app/node_modules
      - node_modules_admin:/app/apps/admin/node_modules
      - node_modules_store:/app/apps/store/node_modules
      - node_modules_jamii:/app/apps/jamii/node_modules
      - node_modules_db:/app/packages/db/node_modules
      - node_modules_ui:/app/packages/ui/node_modules
      - node_modules_domain:/app/packages/domain/node_modules
      - node_modules_auth:/app/packages/auth/node_modules
      - node_modules_a11y:/app/packages/a11y/node_modules
      - node_modules_config:/app/packages/config/node_modules
      - node_modules_payments:/app/packages/payments/node_modules
      - node_modules_core_service:/app/services/core/node_modules
      - next_cache_web:/app/apps/web/.next
      - next_cache_app:/app/apps/app/.next
      - next_cache_admin:/app/apps/admin/.next
      - next_cache_store:/app/apps/store/.next
      - next_cache_jamii:/app/apps/jamii/.next
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      core-go:
        condition: service_started

  # ─────────────────────────────────────────────────────────────
  # core-go — the mobile REST API (Go/Gin). See
  # docs/adr/0005-mobile-api-in-go.md. Own port (4100, not 4000 —
  # services/core keeps that) so both can run side by side while the
  # mobile-relevant domains migrate over.
  # ─────────────────────────────────────────────────────────────
  core-go:
    build:
      context: .
      # Dev image (Go toolchain + air), not the static production
      # Dockerfile: the source below is bind-mounted and hot-rebuilds on
      # save, so a core-go edit never needs `up --build` again. Prod is
      # unaffected — render.yaml still builds services/core-go/Dockerfile.
      dockerfile: services/core-go/Dockerfile.dev
    container_name: core-go
    restart: unless-stopped
    ports:
      - "4100:4100"
    volumes:
      # Source, live. Air rebuilds and restarts the binary in place.
      - ./services/core-go:/app
      # Module/build caches off the bind mount, same reasoning the Node
      # apps' node_modules/.next volumes get: the host's pkg dir is empty
      # or the wrong arch, and rebuilding the world on every restart is
      # the thing this setup exists to avoid.
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    environment:
      APP_ENV: "${APP_ENV:-development}"
      PORT: "4100"
      # pgx (unlike Prisma's client) sends query params straight through as
      # Postgres startup parameters, so Prisma-specific hints like
      # pgbouncer=true/connection_limit — which pgbouncer itself rejects —
      # can't be reused verbatim from the TS services' DATABASE_URL.
      DATABASE_URL: postgresql://esoko:esoko_dev_only@pgbouncer:5432/esoko?sslmode=disable
      # pgbouncer above runs POOL_MODE=transaction, which silently
      # breaks Postgres LISTEN/NOTIFY (a listening client has to keep
      # one physical backend connection open, which transaction pooling
      # never guarantees) — the counter ticket queue's live push needs
      # a connection straight to postgres for that one thing.
      DIRECT_DATABASE_URL: postgresql://esoko:esoko_dev_only@postgres:5432/esoko?sslmode=disable
      REDIS_URL: redis://redis:6379
      SMS_PROVIDER: "${SMS_PROVIDER:-console}"
      SMS_TEST_ENV: "${SMS_TEST_ENV:-}"
      SMS_MOCK_URL: http://mock-sms:8080
      CELCOM_API_KEY: "${CELCOM_API_KEY:-}"
      CELCOM_PARTNER_ID: "${CELCOM_PARTNER_ID:-}"
      CELCOM_SHORTCODE: "${CELCOM_SHORTCODE:-}"
      OTP_PEPPER: "${OTP_PEPPER:-dev-pepper-change-me}"
      # Default (5/hour/msisdn) is a production anti-SMS-pumping guard,
      # not something local dev should ever hit — the same demo number
      # gets OTP'd repeatedly across sign-in, PIN reset, and every
      # org-context activation test in one afternoon. Loosened here
      # only; production still gets the real default via this same env
      # var if left unset there.
      OTP_RATE_LIMIT_PER_HOUR: "${OTP_RATE_LIMIT_PER_HOUR:-200}"
      SESSION_SECRET: "${SESSION_SECRET:-dev-session-secret-change-me}"
      AUDIT_CHAIN_SEED: "${AUDIT_CHAIN_SEED:-esoqo-genesis}"
      MPESA_PROVIDER: "${MPESA_PROVIDER:-console}"
      MPESA_CONSUMER_KEY: "${MPESA_CONSUMER_KEY:-}"
      MPESA_CONSUMER_SECRET: "${MPESA_CONSUMER_SECRET:-}"
      MPESA_SHORTCODE: "${MPESA_SHORTCODE:-}"
      MPESA_PASSKEY: "${MPESA_PASSKEY:-}"
      MPESA_CALLBACK_URL: "${MPESA_CALLBACK_URL:-}"
      MPESA_CALLBACK_SECRET: "${MPESA_CALLBACK_SECRET:-}"
      PESAPAL_PROVIDER: "${PESAPAL_PROVIDER:-console}"
      # Strangler bridge: Daraja callbacks Go doesn't own yet
      # (registration/donation) are forwarded byte-identical to TS core.
      TS_CORE_WEBHOOK_URL: http://esoqo-dev:4000
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────
  # CECF WordPress stack — opt-in only (docker compose --profile cecf up)
  # Mirrors the two-service Render topology: cecf-mariadb (private,
  # self-hosted — Render has no managed MySQL) + cecf-wordpress
  # (nginx+php-fpm, built from the shared pnpm workspace).
  # ─────────────────────────────────────────────────────────────
  cecf-mariadb:
    image: mariadb:11
    container_name: cecf-mariadb
    profiles: ["cecf"]
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: cecf_dev_only
      MARIADB_DATABASE: cecf
      MARIADB_USER: cecf
      MARIADB_PASSWORD: cecf_dev_only
    ports:
      - "3306:3306"
    volumes:
      - cecfmysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12

  cecf-wordpress:
    build:
      context: .
      dockerfile: services/cecf-wordpress/Dockerfile
      args:
        APP_URL: http://childeldercare.test
    container_name: cecf-wordpress
    profiles: ["cecf"]
    restart: unless-stopped
    depends_on:
      cecf-mariadb:
        condition: service_healthy
    environment:
      PORT: "8080"
      WP_ENV: development
      WP_HOME: http://childeldercare.test
      WP_SITEURL: http://childeldercare.test/wp
      DB_HOST: cecf-mariadb
      DB_PORT: "3306"
      DB_NAME: cecf
      DB_USER: cecf
      DB_PASSWORD: cecf_dev_only
      MULTISITE_ENABLED: "true"
      MULTISITE_SUBDOMAIN: "true"
      MULTISITE_DOMAIN: childeldercare.test
      WP_ADMIN_USER: cecf-admin
      WP_ADMIN_PASSWORD: cecf_dev_only
      WP_ADMIN_EMAIL: dev@childeldercare.test
      REDIS_URL: redis://redis:6379/1
      # Where "Register"/"Apply" CTAs — and /apply/ itself — send people;
      # see App\Support\PageUrl::esoqoJoinUrl(). localhost:3001 is the host
      # port apps/app's dev server binds to, reachable from this container
      # via the host's loopback (see also docker-compose's esoqo-dev service).
      ESOQO_JOIN_URL: http://localhost:3001/join
      # Where every "page": "jamii" CTA sends people (pages/jamii.json,
      # the Programs/nav item introducing the product) — see
      # App\Support\PageUrl::esoqoJamiiUrl(). Same host-loopback reasoning
      # as ESOQO_JOIN_URL above; 3004 is apps/jamii's own dev port.
      ESOQO_JAMII_URL: http://localhost:3004/
      # services/core's authenticated /api/cecf/* facade — see
      # App\Support\CecfApiClient. esoqo-dev is the esoqo stack's own
      # compose service name, reachable on the same docker network;
      # CECF_SERVICE_SECRET must match esoqo-dev's own env exactly.
      ESOQO_CORE_API_URL: http://esoqo-dev:4000
      CECF_SERVICE_SECRET: dev-cecf-secret-local-only
      AUTH_KEY: dev
      SECURE_AUTH_KEY: dev
      LOGGED_IN_KEY: dev
      NONCE_KEY: dev
      AUTH_SALT: dev
      SECURE_AUTH_SALT: dev
      LOGGED_IN_SALT: dev
      NONCE_SALT: dev
    ports:
      - "8090:8080"
    volumes:
      - cecfuploads:/var/www/html/web/app/uploads

volumes:
  pgdata:
  redisdata:
  cecfmysqldata:
  cecfuploads:
  node_modules_root:
  node_modules_web:
  node_modules_app:
  node_modules_admin:
  node_modules_store:
  node_modules_jamii:
  node_modules_db:
  node_modules_ui:
  node_modules_domain:
  node_modules_auth:
  node_modules_a11y:
  node_modules_config:
  node_modules_payments:
  node_modules_core_service:
  go_mod_cache:
  go_build_cache:
  next_cache_web:
  next_cache_app:
  next_cache_admin:
  next_cache_store:
  next_cache_jamii:
