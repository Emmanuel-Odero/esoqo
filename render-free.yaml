# ════════════════════════════════════════════════════════════════
#  Esoqo — Render Blueprint, FREE TIER
#
#  A separate blueprint from render.yaml (the paid one), not a flag
#  on it — free and paid differ in more than `plan:`. This one:
#    · has no `databases:` block. Render's own Postgres/Redis are not
#      free beyond a 30-day trial; DATABASE_URL/DIRECT_DATABASE_URL/
#      REDIS_URL point at Neon and Upstash instead (their free tiers
#      don't expire). Set those four as dashboard secrets after the
#      first blueprint apply — see Deploy_Free.md.
#    · drops cecf-wordpress and cecf-mariadb entirely. Self-hosted
#      MySQL with a persistent disk has no free option on any of
#      these platforms; CECF WordPress stays on its existing paid
#      setup. See Deploy_Free.md for the reasoning.
#    · every service is `plan: free`, which means each one spins down
#      after ~15 minutes idle and cold-starts (10-60s) on the next
#      request — including services/core, whose whole reason for
#      existing (ADR-0001) is to NOT do that. This blueprint is for a
#      pilot/demo/review deployment, not the always-on core plane the
#      architecture is designed around. Said plainly in Deploy_Free.md,
#      not left for someone to discover in an incident.
#
#  Deploy: render blueprint apply --repo <url> -f render-free.yaml
#          or Render Dashboard → Blueprint → point at this file.
#
#  Run migrations manually after first deploy (same as render.yaml):
#      DATABASE_URL="<neon-direct-url>" DIRECT_DATABASE_URL="<neon-direct-url>" \
#      pnpm --filter @esoqo/db exec prisma migrate deploy
# ════════════════════════════════════════════════════════════════

services:
  # ── Core API — Fastify domain service ──────────────────────
  - type: web
    name: esoko-core
    runtime: node
    plan: free
    repo: https://github.com/Emmanuel-Odero/esoko-254.git
    branch: render
    buildCommand: npm install -g pnpm@9.12.0 && NODE_ENV=development pnpm install && pnpm --filter @esoqo/db generate && pnpm --filter @esoqo/core-service build
    startCommand: pnpm --filter @esoqo/core-service start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false   # Neon pooled connection string — see Deploy_Free.md
      - key: DIRECT_DATABASE_URL
        sync: false   # Neon direct (non-pooled) connection string
      - key: SHADOW_DATABASE_URL
        sync: false   # a second Neon branch, or reuse DIRECT_DATABASE_URL
      - key: REDIS_URL
        sync: false   # Upstash rediss:// URL
      - key: SESSION_SECRET
        sync: false
      - key: OTP_PEPPER
        sync: false
      - key: AUDIT_CHAIN_SEED
        sync: false
      - key: SMS_PROVIDER
        value: console
      - key: SMS_API_KEY
        sync: false
      - key: SMS_USERNAME
        sync: false
      - key: SMS_SENDER_ID
        value: ESOQO
      - key: SEED_ADMIN_PIN
        sync: false
      - key: SEED_ADMIN_HASH
        sync: false

