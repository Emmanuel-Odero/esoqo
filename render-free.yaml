    healthCheckPath: /help
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: SHADOW_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: OTP_PEPPER
        sync: false
      - key: AUDIT_CHAIN_SEED
        sync: false
      - key: NEXT_PUBLIC_WEB_URL
        value: https://esoko-web.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://esoko-app.onrender.com
      - key: NEXT_PUBLIC_STORE_URL
        value: https://esoko-store.onrender.com
      - key: CORE_API_URL
        value: https://esoko-core.onrender.com

