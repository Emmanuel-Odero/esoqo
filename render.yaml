# ════════════════════════════════════════════════════════════════
#  Esoko — Render Blueprint (Infrastructure as Code)
#
#  Deploy: connect this repo in Render Dashboard → Blueprint
#         or run: render blueprint apply --repo <url>
#
#  Important:
#  · Build/start commands run from the REPO ROOT (no rootDir).
#    pnpm workspaces require the project root to resolve correctly.
#  · Create a Redis KV store manually in the Render Dashboard
#    after provisioning, then set REDIS_URL on all services.
#  · Run migrations manually after first deploy:
#      DATABASE_URL="<url>" pnpm --filter @esoko/db exec prisma migrate deploy
#
#  · cecf-wordpress (CECF multisite) is a separate deploy of the SAME
#    blueprint/repo — one Render service, own domain, own database —
#    but it is a Docker service, not a Node one: dockerContext is the
#    repo root so its build can reuse this repo's pnpm-lock.yaml for the
#    Sage theme's asset build (services/cecf-wordpress/web/app/themes/cecf-sage
#    is a real pnpm workspace package). See services/cecf-wordpress/README.md.
#  · Render has no managed MySQL/MariaDB, so cecf-mariadb runs as a
#    private service (no public ingress) with its own persistent disk.
#    MARIADB_ROOT_PASSWORD / MARIADB_PASSWORD are set once in the
#    dashboard and duplicated (sync: false) onto cecf-wordpress's DB_PASSWORD
#    — same pattern already used for SESSION_SECRET etc. across esoko-*.
# ════════════════════════════════════════════════════════════════

services:
  # ── Core API — Fastify domain service ──────────────────────
  - type: web
    name: esoko-core
    runtime: node
    repo: https://github.com/Emmanuel-Odero/esoko-254.git
    branch: render
    buildCommand: npm install -g pnpm@9.12.0 && NODE_ENV=development pnpm install && pnpm --filter @esoko/db generate && pnpm --filter @esoko/core-service build
    startCommand: pnpm --filter @esoko/core-service start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: esoko-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: esoko-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: OTP_PEPPER
        sync: false
      - key: AUDIT_CHAIN_SEED
        sync: false
      - key: CECF_SERVICE_SECRET
        sync: false   # must match CECF_SERVICE_SECRET on cecf-wordpress below — signs/verifies the WP↔core cecf/v1 <-> /api/cecf/* handshake
      - key: SMS_PROVIDER
        value: console
      - key: SMS_API_KEY
        sync: false
      - key: SMS_USERNAME
        sync: false
      - key: SMS_SENDER_ID
        value: ESOKO
      - key: SEED_ADMIN_PIN
        sync: false
      - key: SEED_ADMIN_HASH
        sync: false

  # ── core-go — mobile REST API (Go/Gin). See
  #    docs/adr/0005-mobile-api-in-go.md. Docker runtime, same shape as
  #    cecf-wordpress below, since it has no JS build step and isn't a
  #    pnpm workspace member. Additive alongside esoko-core, not a
  #    replacement, until the mobile-relevant domains have migrated.
  - type: web
    name: esoko-core-go
    runtime: docker
    repo: https://github.com/Emmanuel-Odero/esoko-254.git
    branch: render
    dockerfilePath: ./services/core-go/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: esoko-db
          property: connectionString
      - key: REDIS_URL
        sync: false   # same Redis instance as esoko-core above — set to the same value
      - key: SESSION_SECRET
        sync: false   # must match esoko-core's SESSION_SECRET — sessions are read by both while both run
      - key: OTP_PEPPER
        sync: false   # must match esoko-core's OTP_PEPPER
      - key: AUDIT_CHAIN_SEED
        sync: false   # must match esoko-core's AUDIT_CHAIN_SEED — same hash chain, same seed
      - key: SMS_PROVIDER
        value: console
      - key: MPESA_PROVIDER
        value: console
      - key: PESAPAL_PROVIDER
        value: console
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # comma-separated; only the Flutter app's web build needs this — set once that's deployed somewhere

  # ── Web — public-facing site ───────────────────────────────
  - type: web
    name: esoko-web
    runtime: node
    repo: https://github.com/Emmanuel-Odero/esoko-254.git
    branch: render
    buildCommand: npm install -g pnpm@9.12.0 && NODE_ENV=development pnpm install && pnpm --filter @esoko/db generate && pnpm --filter @esoko/web build
    startCommand: pnpm --filter @esoko/web start
    healthCheckPath: /help
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: esoko-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: esoko-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: OTP_PEPPER
        sync: false
      - key: AUDIT_CHAIN_SEED
        sync: false
      - key: NEXT_PUBLIC_WEB_URL
        value: https://esoko-web.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://esoko-app-lvqp.onrender.com
      - key: CORE_API_URL
        value: https://esoko-core.onrender.com

  # ── App — authenticated PWA surface ────────────────────────
  - type: web
    name: esoko-app
    runtime: node
    repo: https://github.com/Emmanuel-Odero/esoko-254.git
    branch: render
    buildCommand: npm install -g pnpm@9.12.0 && NODE_ENV=development pnpm install && pnpm --filter @esoko/db generate && pnpm --filter @esoko/app build
    startCommand: pnpm --filter @esoko/app start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: esoko-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: esoko-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: OTP_PEPPER
        sync: false
      - key: AUDIT_CHAIN_SEED
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: esoko
      - key: NEXT_PUBLIC_WEB_URL
        value: https://esoko-web.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://esoko-app-lvqp.onrender.com
      - key: CORE_API_URL
        value: https://esoko-core.onrender.com
      - key: NEXT_PUBLIC_CECF_URL
        value: https://childeldercare.foundation
      # M-Pesa STK push for CECF registration checkout (join flow), store
      # checkout and ticket bookings — this service is the one that calls
      # initiateStkPush, see packages/payments/src/mpesa.ts. Defaults to
      # the Daraja sandbox: real money only moves once someone deliberately
      # changes MPESA_PROVIDER to "production" here, with production
      # credentials behind it. The four sync:false values below must be
      # entered by hand in the Render dashboard — never commit them here.
      - key: MPESA_PROVIDER
        value: sandbox
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      # Safaricom POSTs the payment result here — must be esoko-core's
      # public URL (not esoko-app's), since that's the service with the
      # /webhooks/mpesa/stk-callback route.
      - key: MPESA_CALLBACK_URL
        value: https://esoko-core.onrender.com/webhooks/mpesa/stk-callback

  # ── Admin — operations dashboard ──────────────────────────
  - type: web
    name: esoko-admin
    runtime: node
    repo: https://github.com/Emmanuel-Odero/esoko-254.git
    branch: render
    buildCommand: npm install -g pnpm@9.12.0 && NODE_ENV=development pnpm install && pnpm --filter @esoko/db generate && pnpm --filter @esoko/admin build
    startCommand: pnpm --filter @esoko/admin start
    healthCheckPath: /signin
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: esoko-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: esoko-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: OTP_PEPPER
        sync: false
      - key: AUDIT_CHAIN_SEED
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: esoko
      - key: NEXT_PUBLIC_WEB_URL
        value: https://esoko-web.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://esoko-app-lvqp.onrender.com
      - key: CORE_API_URL
        value: https://esoko-core.onrender.com

  # ── CECF WordPress — Bedrock + Sage multisite network ──────
  # One Bedrock codebase + one shared MySQL database serves every
  # CECF property (childeldercare.foundation, donate.*, blog.*, ...)
  # as blogs in a subdomain multisite network — nginx + php-fpm run
  # together in this one container/instance.
  - type: web
    name: cecf-wordpress
    runtime: docker
    repo: https://github.com/Emmanuel-Odero/esoko-254.git
    branch: render
    dockerfilePath: ./services/cecf-wordpress/Dockerfile
    dockerContext: .
    plan: standard
    region: frankfurt
    disk:
      name: cecf-uploads
      mountPath: /var/www/html/web/app/uploads
      sizeGB: 10
    envVars:
      - key: WP_ENV
        value: production
      - key: WP_HOME
        sync: false   # https://childeldercare.foundation — set by hand in the Render dashboard, not committed here (was hardcoded; see custom-domain setup notes in Deploy_Render.md)
      - key: WP_SITEURL
        sync: false   # <WP_HOME>/wp — same reasoning, set by hand in the Render dashboard
      - key: DB_HOST
        fromService:
          type: pserv
          name: cecf-mariadb
          property: host
      - key: DB_PORT
        fromService:
          type: pserv
          name: cecf-mariadb
          property: port
      - key: DB_NAME
        value: cecf
      - key: DB_USER
        value: cecf
      - key: DB_PASSWORD
        sync: false   # must match MARIADB_PASSWORD on cecf-mariadb below
      - key: MULTISITE_ENABLED
        value: "true"
      - key: MULTISITE_SUBDOMAIN
        value: "true"
      - key: MULTISITE_DOMAIN
        sync: false   # childeldercare.foundation — set by hand alongside WP_HOME/WP_SITEURL above
      - key: ESOKO_CORE_API_URL
        value: https://esoko-core.onrender.com   # esoko-core (Oregon) and cecf-wordpress (Frankfurt) are in different regions, so Render's private networking can't reach across them — this must be the public HTTPS URL, not an internal hostname
      - key: CECF_SERVICE_SECRET
        sync: false   # must match CECF_SERVICE_SECRET on esoko-core above — generate once, paste into both dashboard entries
      - key: REDIS_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: cecf-media
      - key: R2_PUBLIC_URL
        sync: false   # bucket's public-read origin — r2.dev subdomain or a custom domain mapped to it
      - key: WP_ADMIN_USER
        sync: false
      - key: WP_ADMIN_PASSWORD
        sync: false   # only read on first boot (empty DB) — see docker/entrypoint.sh
      - key: WP_ADMIN_EMAIL
        sync: false
      - key: AUTH_KEY
        generateValue: true
      - key: SECURE_AUTH_KEY
        generateValue: true
      - key: LOGGED_IN_KEY
        generateValue: true
      - key: NONCE_KEY
        generateValue: true
      - key: AUTH_SALT
        generateValue: true
      - key: SECURE_AUTH_SALT
        generateValue: true
      - key: LOGGED_IN_SALT
        generateValue: true
      - key: NONCE_SALT
        generateValue: true

  # ── CECF MariaDB — private service, no public ingress ──────
  # Render has no managed MySQL offering; this is self-hosted with a
  # persistent disk. Single instance only — no failover/read replicas.
  # Back it up via a separate cron service (mysqldump -> R2/S3).
  - type: pserv
    name: cecf-mariadb
    runtime: image
    image:
      url: docker.io/library/mariadb:11
    plan: starter
    region: frankfurt
    disk:
      name: cecf-mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MARIADB_ROOT_PASSWORD
        sync: false
      - key: MARIADB_DATABASE
        value: cecf
      - key: MARIADB_USER
        value: cecf
      - key: MARIADB_PASSWORD
        sync: false   # must match DB_PASSWORD on cecf-wordpress above

# ─────────────────────────────────────────────────────────────
# Databases
# ─────────────────────────────────────────────────────────────
databases:
  - name: esoko-db
    databaseName: esoko
    user: esoko
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: 16
