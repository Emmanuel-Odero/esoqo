# ════════════════════════════════════════════════════════════════
#  Esoko — Render Blueprint (Infrastructure as Code)
#
#  Deploy: connect this repo in Render Dashboard → Blueprint
#         or run: render blueprint apply --repo <url>
#
#  Important:
#  · Build/start commands run from the REPO ROOT (no rootDir).
#    pnpm workspaces require the project root to resolve correctly.
#  · Create a Redis KV store manually in the Render Dashboard
#    after provisioning, then set REDIS_URL on all services.
#  · Run migrations manually after first deploy:
#      DATABASE_URL="<url>" pnpm --filter @esoko/db exec prisma migrate deploy
# ════════════════════════════════════════════════════════════════

services:
  # ── Core API — Fastify domain service ──────────────────────
  - type: web
    name: esoko-core
    runtime: node
    repo: https://github.com/Emmanuel-Odero/esoko-254.git
    branch: render
    buildCommand: npm install -g pnpm@9.12.0 && NODE_ENV=development pnpm install && pnpm --filter @esoko/core-service build
    startCommand: pnpm --filter @esoko/core-service start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: esoko-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: esoko-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: OTP_PEPPER
        sync: false
      - key: AUDIT_CHAIN_SEED
        sync: false
      - key: SMS_PROVIDER
        value: console
      - key: SMS_API_KEY
        sync: false
      - key: SMS_USERNAME
        sync: false
      - key: SMS_SENDER_ID
        value: ESOKO
      - key: SEED_ADMIN_PIN
        sync: false
      - key: SEED_ADMIN_HASH
        sync: false

  # ── Web — public-facing site ───────────────────────────────
  - type: web
    name: esoko-web
    runtime: node
    repo: https://github.com/Emmanuel-Odero/esoko-254.git
    branch: render
    buildCommand: npm install -g pnpm@9.12.0 && NODE_ENV=development pnpm install && pnpm --filter @esoko/web build
    startCommand: pnpm --filter @esoko/web start
    healthCheckPath: /help
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: esoko-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: esoko-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: OTP_PEPPER
        sync: false
      - key: AUDIT_CHAIN_SEED
        sync: false
      - key: NEXT_PUBLIC_WEB_URL
        value: https://esoko-web.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://esoko-app-lvqp.onrender.com
      - key: CORE_API_URL
        value: https://esoko-core.onrender.com

  # ── App — authenticated PWA surface ────────────────────────
  - type: web
    name: esoko-app
    runtime: node
    repo: https://github.com/Emmanuel-Odero/esoko-254.git
    branch: render
    buildCommand: npm install -g pnpm@9.12.0 && NODE_ENV=development pnpm install && pnpm --filter @esoko/app build
    startCommand: pnpm --filter @esoko/app start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: esoko-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: esoko-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: OTP_PEPPER
        sync: false
      - key: AUDIT_CHAIN_SEED
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: esoko
      - key: NEXT_PUBLIC_WEB_URL
        value: https://esoko-web.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://esoko-app-lvqp.onrender.com
      - key: CORE_API_URL
        value: https://esoko-core.onrender.com

  # ── Admin — operations dashboard ──────────────────────────
  - type: web
    name: esoko-admin
    runtime: node
    repo: https://github.com/Emmanuel-Odero/esoko-254.git
    branch: render
    buildCommand: npm install -g pnpm@9.12.0 && NODE_ENV=development pnpm install && pnpm --filter @esoko/admin build
    startCommand: pnpm --filter @esoko/admin start
    healthCheckPath: /signin
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: esoko-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: esoko-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: OTP_PEPPER
        sync: false
      - key: AUDIT_CHAIN_SEED
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: esoko
      - key: NEXT_PUBLIC_WEB_URL
        value: https://esoko-web.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://esoko-app-lvqp.onrender.com
      - key: CORE_API_URL
        value: https://esoko-core.onrender.com

# ─────────────────────────────────────────────────────────────
# Databases
# ─────────────────────────────────────────────────────────────
databases:
  - name: esoko-db
    databaseName: esoko
    user: esoko
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: 16
