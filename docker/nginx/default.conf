upstream web { server esoko-dev:3000; }
upstream app { server esoko-dev:3001; }
upstream admin { server esoko-dev:3002; }
upstream api { server esoko-dev:4000; }
upstream store { server esoko-dev:3003; }
upstream jamii { server esoko-dev:3004; }

# store and jamii get their own dev hostnames rather than a /store/ or
# /jamii/ path prefix under the default vhost below: both apps do their
# own host-based multi-tenant routing (apps/store/proxy.ts rewrites
# *.esoko.global subdomains onto /s/[slug]; apps/jamii/src/middleware.ts
# rewrites custom domains onto /o/[slug]), and neither has a Next.js
# basePath configured — a path prefix would desync from their own
# root-relative /_next/* asset URLs and internal links. A distinct Host
# instead passes straight through unmolested, same as childeldercare.test
# below. Point store.esoko.test and jamii.esoko.test at 127.0.0.1 in
# /etc/hosts to use these (same as childeldercare.test — see
# services/cecf-wordpress/README.md).
server {
    listen 80;
    server_name store.esoko.test;

    location / {
        proxy_pass http://store;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# jamii.esoko.test must also be listed in JAMII_PRIMARY_HOSTS (see
# docker-compose.yml's esoko-dev service) — apps/jamii/src/middleware.ts
# treats any Host it doesn't recognise as a customer's custom domain and
# looks it up in Postgres, 404ing when it isn't found there.
server {
    listen 80;
    server_name jamii.esoko.test;

    location / {
        proxy_pass http://jamii;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# CECF WordPress network — childeldercare.test (+ any *.childeldercare.test
# subsite, once the network has more than the root blog) proxies straight
# through to the cecf-wordpress container, same as production will front
# it with a real reverse proxy/CDN in front of *.childeldercare.foundation.
#
# cecf-wordpress only exists when compose is run with `--profile cecf`, so
# it can't be a static `upstream` block — nginx resolves those at startup
# and refuses to boot ("host not found in upstream") whenever the profile
# is off, taking down every other vhost with it. Resolving the hostname
# lazily via Docker's embedded DNS (127.0.0.11) at request time instead
# means nginx always starts; this vhost alone 502s until the profile is up.
server {
    listen 80;
    server_name childeldercare.test *.childeldercare.test;

    resolver 127.0.0.11 valid=10s;

    location / {
        set $cecf_wordpress cecf-wordpress:8080;
        proxy_pass http://$cecf_wordpress;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    # default_server: nginx otherwise falls back to whichever `server`
    # block listens on :80 and appears first in the file for any Host it
    # can't match — which was the childeldercare.test vhost above, silently
    # routing plain/unrecognized-Host requests (e.g. "localhost") into
    # CECF WordPress instead of here.
    listen 80 default_server;
    server_name _;

    location /ops/ {
        proxy_pass http://admin/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /app/ {
        proxy_pass http://app/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
