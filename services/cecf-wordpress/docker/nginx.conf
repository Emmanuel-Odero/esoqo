# Single vhost handles every subsite in the multisite network — the
# network itself (via DOMAIN_CURRENT_SITE / SUBDOMAIN_INSTALL in
# config/application.php) resolves $host to the right blog, not nginx.
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 64m;

    access_log /dev/stdout;
    error_log /dev/stderr;

    server {
        # Render terminates TLS at the edge and forwards plain HTTP.
        # __PORT__ is substituted by entrypoint.sh from $PORT at boot.
        listen __PORT__ default_server;
        server_name _;

        root /var/www/html/web;
        index index.php;

        # Wildcard subdomain network: any *.childeldercare.foundation
        # (or the bare apex) lands here and WordPress resolves the blog.
        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        # Bedrock moves wp-content -> app/, but ms-files.php rewrites in
        # older multisite setups still expect this path.
        rewrite ^/app/uploads/(.*)$ /wp/wp-content/uploads/$1 last;

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|webp|ico|woff2?)$ {
            expires 30d;
            access_log off;
            add_header Cache-Control "public";
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location ~ /\.ht {
            deny all;
        }
    }
}
